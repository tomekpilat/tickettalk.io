services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_ENV: production
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in Coolify}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in Coolify}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY in Coolify}
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - app

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      APP_ENV: production
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in Coolify}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in Coolify}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in Coolify}
      JIRA_ENCRYPTION_KEY: ${JIRA_ENCRYPTION_KEY:?Set JIRA_ENCRYPTION_KEY in Coolify}
      RATE_LIMIT_JOIN_PER_MINUTE: ${RATE_LIMIT_JOIN_PER_MINUTE:-20}
      RATE_LIMIT_IMPORT_PER_MINUTE: ${RATE_LIMIT_IMPORT_PER_MINUTE:-12}
      RATE_LIMIT_VOTE_PER_MINUTE: ${RATE_LIMIT_VOTE_PER_MINUTE:-120}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - app

networks:
  app:
    driver: bridge
