[project]
name = "tickettalks-api"
version = "0.1.0"
description = "FastAPI service for collaborative story pricing"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "supabase>=2.12,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=7.1.0",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/* 2.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
